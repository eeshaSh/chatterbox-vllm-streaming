global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'chatterbox-tts'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['TTS_TARGET_PLACEHOLDER']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
